name: qd-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps
      - name: probe
        run: |
          python3 - << 'PYEOF'
          from playwright.sync_api import sync_playwright
          import json, time, re

          BOOK = '1010868264'
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=['--disable-blink-features=AutomationControlled'])
              ctx = browser.new_context(
                  user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36',
                  viewport={'width': 1440, 'height': 900}, locale='zh-CN')
              page = ctx.new_page()
              page.goto(f'https://www.qidian.com/book/{BOOK}', timeout=60000)
              for i in range(15):
                  time.sleep(2)
                  if '诡秘' in page.title():
                      break
              # 捕获全部 XHR/fetch
              reqs = []
              page.on('request', lambda r: reqs.append(r.method + ' ' + r.url) if r.resource_type in ('xhr','fetch') else None)
              page.goto('https://www.qidian.com/chapter/1010868264/402733549/', timeout=60000)
              time.sleep(12)
              print('CH_TITLE:', page.title(), flush=True)
              interesting = [u for u in reqs if 'comment' in u.lower() or 'segment' in u.lower() or 'review' in u.lower() or 'count' in u.lower()]
              print('INTERESTING_XHR:', json.dumps(interesting[:12], ensure_ascii=False), flush=True)
              print('ALL_XHR_COUNT:', len(reqs), flush=True)
              browser.close()
          PYEOF
