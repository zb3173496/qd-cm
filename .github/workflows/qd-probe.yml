name: qd-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps
      - name: probe
        run: |
          python3 - << 'PYEOF'
          from playwright.sync_api import sync_playwright
          import json, time

          BOOK = '1010868264'  # 诡秘之主
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=['--disable-blink-features=AutomationControlled'])
              ctx = browser.new_context(
                  user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36',
                  viewport={'width': 1440, 'height': 900}, locale='zh-CN')
              page = ctx.new_page()
              reqs = []
              page.on('request', lambda r: reqs.append(r.url) if 'ajax' in r.url or 'api' in r.url else None)
              page.goto(f'https://www.qidian.com/book/{BOOK}', timeout=60000)
              for i in range(15):
                  time.sleep(2)
                  if '诡秘' in page.title():
                      break
              print('TITLE:', page.title(), flush=True)
              csrf = [c['value'] for c in ctx.cookies('https://www.qidian.com') if c['name'] == '_csrfToken']
              csrf = csrf[0] if csrf else ''
              print('CSRF_LEN:', len(csrf), flush=True)

              def api(url, extra=None):
                  return page.evaluate("""async ([u, extra]) => {
                      const h = {'Accept': 'application/json'};
                      if (extra) Object.assign(h, extra);
                      const r = await fetch(u, {headers: h});
                      const txt = await r.text();
                      let j = null; try { j = JSON.parse(txt); } catch(e) {}
                      return {status: r.status, isJson: !!j, head: txt.slice(0,200), json: j};
                  }""", [url, extra])

              # A: 带 X-Requested-With 再试目录
              r1 = api(f'https://www.qidian.com/ajax/book/category?bookId={BOOK}', {'X-Requested-With': 'XMLHttpRequest'})
              print('CAT_A:', r1['status'], json.dumps(r1['json'], ensure_ascii=False)[:300] if r1['json'] else r1['head'], flush=True)

              # B: 打开目录页，抓它自己发的 XHR
              reqs.clear()
              try:
                  page.goto(f'https://www.qidian.com/book/{BOOK}/catalog', timeout=60000)
                  time.sleep(8)
                  print('CAT_PAGE_TITLE:', page.title(), flush=True)
                  print('XHR_SEEN:', json.dumps(reqs[:10]), flush=True)
              except Exception as e:
                  print('CAT_PAGE_ERR:', str(e)[:100], flush=True)

              # C: 段评接口直测（用第一章已知 chapterId）
              r2 = api(f'https://www.qidian.com/ajax/chapter/getchaptercomments?bookId={BOOK}&chapterId=402733549&_csrfToken={csrf}')
              print('COUNTS:', r2['status'], json.dumps(r2['json'], ensure_ascii=False)[:400] if r2['json'] else r2['head'], flush=True)
              r3 = api(f'https://www.qidian.com/ajax/chapterReview/reviewList?bookId={BOOK}&chapterId=402733549&page=1&pageSize=20&segmentId=1&type=2&_csrfToken={csrf}')
              print('REVIEWLIST:', r3['status'], json.dumps(r3['json'], ensure_ascii=False)[:600] if r3['json'] else r3['head'], flush=True)
              browser.close()
          PYEOF
